<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Мебляр PRO</title>

<style>

body {
    font-family: Arial, sans-serif;
    background:#111827;
    color:white;
    padding:16px;
}

h1 {
    text-align:center;
}

.card {
    background:#1f2937;
    padding:20px;
    border-radius:18px;
    margin-bottom:18px;
}

label {
    display:block;
    margin-top:12px;
    color:#cbd5e1;
}

input, select, button {

    width:100%;
    padding:14px;
    margin-top:6px;
    border-radius:10px;
    border:none;
    font-size:16px;

}

button {

    background:#2563eb;
    color:white;
    font-weight:bold;
    margin-top:20px;

}

.item {

    border-bottom:1px solid #334155;
    padding:12px 0;

}

.total {

    font-size:24px;
    color:#4ade80;
    font-weight:bold;

}

.small {

    color:#94a3b8;

}

</style>

</head>


<body>


<h1>🪚 Мебляр PRO</h1>



<div class="card">

<h2>Проєкт</h2>

<p>
Нижня кухонна тумба
</p>


<label>
Ширина модуля (мм)
</label>

<input id="width" value="600">


<label>
Висота модуля (мм)
</label>

<input id="height" value="720">


<label>
Глибина модуля (мм)
</label>

<input id="depth" value="560">


<label>
Матеріал корпусу
</label>

<select id="board">

<option value="950">
Egger ДСП 18 мм — 950 грн/м²
</option>

<option value="800">
Kronospan ДСП 18 мм — 800 грн/м²
</option>

<option value="750">
Swiss Krono ДСП 18 мм — 750 грн/м²
</option>

</select>


</div>




<div class="card">

<h2>🚪 Фасад</h2>


<label>
Тип фасаду
</label>


<select id="facade">


<option value="3500" data-edge="false">
МДФ фарбований — 3500 грн/м²
</option>


<option value="2200" data-edge="false">
МДФ плівка — 2200 грн/м²
</option>


<option value="1200" data-edge="true">
ДСП фасад — 1200 грн/м²
</option>


<option value="4200" data-edge="true">
Акрил — 4200 грн/м²
</option>


</select>


<p class="small">

Кількість:
1 шт

<br>

Зазор:
2 мм по периметру

</p>


</div>




<div class="card">


<h2>💰 Розрахунок</h2>


<label>
Коефіцієнт
</label>


<input id="factor" value="1.65">


<button onclick="calculate()">

РОЗРАХУВАТИ

</button>


</div>




<div class="card">

<h2>Результат</h2>

<div id="result">

Очікування...

</div>


</div>





<script>


function calculate(){


let width =
Number(document.getElementById("width").value);


let height =
Number(document.getElementById("height").value);


let depth =
Number(document.getElementById("depth").value);



let boardPrice =
Number(document.getElementById("board").value);



let factor =
Number(document.getElementById("factor").value);



let facadeSelect =
document.getElementById("facade");


let facadePrice =
Number(facadeSelect.value);



let facadeName =
facadeSelect.options[facadeSelect.selectedIndex].text;



let parts=[];

let boardArea=0;



function addPart(name,w,h,qty){


let area =
(w*h/1000000)*qty;


boardArea += area;


parts.push({

name,
w,
h,
qty,
area

});


}



addPart(
"Ліва стійка",
depth,
height,
1
);


addPart(
"Права стійка",
depth,
height,
1
);


addPart(
"Дно",
width-36,
depth-36,
1
);


addPart(
"Верхня царга",
width-36,
100,
2
);



let waste =
boardArea*0.10;


let boardCost =
(boardArea+waste)*boardPrice;



// ХДФ

let hdfArea =
(width*height)/1000000;


let hdfCost =
hdfArea*350;




// ФАСАД

let facadeWidth =
width-4;


let facadeHeight =
height-4;


let facadeArea =
(facadeWidth*facadeHeight)/1000000;


let facadeCost =
facadeArea*facadePrice;




// ФУРНІТУРА

let hinges = 2;

let hardwareCost =
hinges*120;



let total =
boardCost+
hdfCost+
facadeCost+
hardwareCost;


let clientPrice =
total*factor;



let html="";



html+=`

<h3>📦 Корпус</h3>

<div class="item">

ДСП:

${boardArea.toFixed(3)} м²

<br>

Відходи:

10%

<br>

Вартість:

<b>${boardCost.toFixed(0)} грн</b>

</div>

`;



html+=`

<h3>🚪 Фасад</h3>

<div class="item">

Тип:

${facadeName}

<br><br>

Розмір:

${facadeWidth} × ${facadeHeight} мм

<br>

Площа:

${facadeArea.toFixed(3)} м²

<br>

Ціна:

${facadePrice} грн/м²

<br><br>

Вартість фасаду:

<b>${facadeCost.toFixed(0)} грн</b>

<br>

Крайка:

${facadeName.includes("фарбований") 
? "Не застосовується"
: "Потрібна"}

</div>

`;



html+=`

<h3>🔩 Фурнітура</h3>

<div class="item">

Blum Clip Top

<br>

${hinges} шт.

<br>

${hardwareCost} грн

</div>

`;



html+=`

<h3>Підсумок</h3>

<div class="item">

Собівартість:

<b>${total.toFixed(0)} грн</b>

<br><br>

Коефіцієнт:

${factor}

</div>


<div class="total">

Ціна клієнта:

${clientPrice.toFixed(0)} грн

</div>

`;



document.getElementById("result").innerHTML=html;


}


</script>


</body>

</html>
