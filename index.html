<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Мебляр PRO</title>

<style>

body {
    font-family: Arial, sans-serif;
    background:#111827;
    color:white;
    padding:16px;
}

h1 {
    text-align:center;
}

.card {
    background:#1f2937;
    padding:20px;
    border-radius:18px;
    margin-bottom:20px;
}

label {
    display:block;
    margin-top:12px;
    color:#cbd5e1;
}

input, select, button {

    width:100%;
    padding:14px;
    margin-top:6px;
    border-radius:10px;
    border:none;
    font-size:16px;

}

button {

    background:#2563eb;
    color:white;
    font-weight:bold;
    margin-top:20px;

}

.result {

background:#0f172a;
padding:15px;
border-radius:12px;

}

.item {

padding:10px 0;
border-bottom:1px solid #334155;

}

.total {

font-size:24px;
color:#4ade80;
font-weight:bold;

}

</style>

</head>


<body>


<h1>🪚 Мебляр PRO</h1>


<div class="card">

<h2>Нижня тумба</h2>


<label>
Ширина мм
</label>

<input id="width" value="600">


<label>
Висота мм
</label>

<input id="height" value="720">


<label>
Глибина мм
</label>

<input id="depth" value="560">


<label>
ДСП корпус
</label>

<select id="board">

<option value="950">
Egger ДСП 18 мм — 950 грн/м²
</option>

<option value="800">
Kronospan ДСП 18 мм — 800 грн/м²
</option>

<option value="750">
Swiss Krono ДСП 18 мм — 750 грн/м²
</option>

</select>



<label>
Фасад
</label>


<select id="front">


<option value="1200">
ДСП фасад — 1200 грн/м²
</option>


<option value="3500">
МДФ фарбований — 3500 грн/м²
</option>


<option value="2200">
МДФ плівка — 2200 грн/м²
</option>


<option value="4200">
Акрил — 4200 грн/м²
</option>


</select>



<label>
Коефіцієнт
</label>

<input id="factor" value="1.65">



<button onclick="calculate()">
РОЗРАХУВАТИ
</button>


</div>



<div class="card">

<h2>Результат</h2>

<div id="result">
Очікування...
</div>

</div>




<script>


function calculate(){


let width =
Number(document.getElementById("width").value);

let height =
Number(document.getElementById("height").value);

let depth =
Number(document.getElementById("depth").value);


let boardPrice =
Number(document.getElementById("board").value);


let frontPrice =
Number(document.getElementById("front").value);


let factor =
Number(document.getElementById("factor").value);



let parts = [];

let boardArea = 0;



function addPart(name,w,h,qty){


let area =
(w*h/1000000)*qty;


boardArea += area;


parts.push({

name,
w,
h,
qty,
area

});


}



addPart(
"Ліва стійка",
depth,
height,
1
);


addPart(
"Права стійка",
depth,
height,
1
);


addPart(
"Дно",
width-36,
depth-36,
1
);


addPart(
"Верхня царга",
width-36,
100,
2
);





let waste =
boardArea*0.10;



let boardCost =
(boardArea+waste)*boardPrice;




// ХДФ

let hdfArea =
(width*height)/1000000;


let hdfCost =
hdfArea*350;




// фасад

let frontWidth =
width-4;


let frontHeight =
height-4;


let frontArea =
(frontWidth*frontHeight)/1000000;


let frontCost =
frontArea*frontPrice;




// фурнітура

let hinges = 2;

let hardwareCost =
hinges*120;



let totalCost =
boardCost+
hdfCost+
frontCost+
hardwareCost;



let finalPrice =
totalCost*factor;



let html="";



html += "<h3>Деталі корпусу</h3>";



parts.forEach(p=>{


html+=`

<div class="item">

<b>${p.name}</b><br>

${p.qty} шт.

<br>

${p.w} × ${p.h} мм

<br>

${p.area.toFixed(3)} м²

</div>

`;

});




html+=`

<div class="item">

<b>ХДФ</b><br>

${hdfArea.toFixed(3)} м²

<br>

${hdfCost.toFixed(0)} грн

</div>



<div class="item">

<b>Фасад</b><br>

${frontWidth} × ${frontHeight} мм

<br>

${frontArea.toFixed(3)} м²

<br>

${frontCost.toFixed(0)} грн

</div>



<div class="item">

<b>Фурнітура</b><br>

Blum Clip Top

<br>

${hinges} шт.

<br>

${hardwareCost} грн

</div>



<br>


Корпус ДСП:

${boardCost.toFixed(0)} грн


<br><br>


Собівартість:

<b>${totalCost.toFixed(0)} грн</b>


<br><br>


Коефіцієнт:

${factor}


<br><br>


<div class="total">

Ціна клієнта:

${finalPrice.toFixed(0)} грн

</div>

`;



document.getElementById("result").innerHTML=html;



}


</script>


</body>

</html>
