
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Мебляр PRO</title>

<style>
body {
    font-family: Arial, sans-serif;
    background:#111827;
    color:white;
    padding:20px;
}

.card {
    background:#1f2937;
    padding:20px;
    border-radius:16px;
}

input, select, button {
    width:100%;
    padding:14px;
    margin-top:10px;
    border-radius:10px;
    border:none;
}

button {
    background:#2563eb;
    color:white;
    font-size:18px;
}
</style>

</head>

<body>

<h1>Мебляр PRO</h1>

<div class="card">

<h2>Нова нижня тумба</h2>

<label>Ширина мм</label>
<input value="600">

<label>Висота мм</label>
<input value="720">

<label>Глибина мм</label>
<input value="560">

<label>Матеріал</label>

<select>
<option>Egger ДСП 18 мм</option>
<option>Kronospan ДСП 18 мм</option>
<option>Swiss Krono ДСП 18 мм</option>
</select>


<button>
Розрахувати
</button>

</div>

</body>
</html>
